name: Atualizar concursos

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write
  issues: write
  pages: write

concurrency: atualizar-concursos

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      # UFs que geram aviso (issue) quando surge concurso novo. "Nacional" = federais.
      # Deixe vazio para ser avisado de todos.
      ALERTA_UFS: "Nacional,RS,SC"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar concursos abertos
        run: python scripts/atualizar_concursos.py

      - name: Salvar mudanças
        id: commit
        run: |
          if git diff --quiet -- concursos.json; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concursos.json
          git commit -m "Atualiza concursos abertos"
          git push
          echo "mudou=true" >> "$GITHUB_OUTPUT"

      - name: Republicar o site
        if: steps.commit.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Avisar concursos novos
        if: hashFiles('alerta.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Novo concurso de Enfermeiro ($ALERTA_UFS) - $(TZ=America/Sao_Paulo date +%d/%m/%Y)" \
            --body-file alerta.md
